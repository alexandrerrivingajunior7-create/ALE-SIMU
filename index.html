<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta id="viewportMeta" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xander ElectroSim v1.0</title>
    <style>
        :root {
            --bg-app: #000000;
            --bg-panel: #0b0b0b;
            --bg-card: #141414;
            --bg-card-hover: #222222;
            --border: #ffffff;
            --border-soft: #444444;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --sheet-bg: #ffffff;
        }

        body.light-theme {
            --bg-app: #ffffff;
            --bg-panel: #f5f5f5;
            --bg-card: #ffffff;
            --bg-card-hover: #e5e5e5;
            --border: #000000;
            --border-soft: #777777;
            --text-main: #000000;
            --text-muted: #444444;
            --sheet-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
        }

        body.desktop-wide .menubar {
            padding: 2px 8px;
            font-size: 11.5px;
        }

        body.desktop-wide .quickbar {
            padding: 3px 8px;
        }

        body.desktop-wide .panel-bottom {
            height: 82px;
        }

        body.desktop-wide .statusbar {
            padding: 2px 10px;
            font-size: 10.5px;
        }

        .menubar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px;
            padding: 4px 8px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-soft);
            font-size: 12px;
            z-index: 50;
        }

        .brand-tag {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            font-weight: 800;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 3px;
            margin-right: 6px;
        }

        .menu-item {
            position: relative;
        }

        .menu-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }

        .menu-btn:hover, .menu-btn.active {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 245px;
            max-height: 70vh;
            overflow: auto;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.75);
            padding: 4px;
            z-index: 80;
        }

        .dropdown.open {
            display: block;
        }

        .dropdown button {
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 3px;
            font-size: 11.5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .dropdown-sep {
            height: 1px;
            background-color: var(--border-soft);
            margin: 3px 0;
        }

        .top-strip {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 4px 8px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-soft);
            z-index: 42;
        }

        .strip-left, .strip-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }

        .strip-sep {
            width: 1px;
            height: 18px;
            background-color: var(--border-soft);
            margin: 0 2px;
        }

        .quickbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            background-color: var(--bg-app);
            border-bottom: 1px solid var(--border-soft);
            z-index: 40;
        }

        .quickbar.collapsed {
            display: none;
        }

        .tool-group {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
            padding: 2px 6px;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
        }

        .group-label {
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-right: 3px;
            letter-spacing: 0.4px;
        }

        .bar-input, .bar-select {
            background-color: var(--bg-app);
            color: var(--text-main);
            border: 1px solid var(--border-soft);
            border-radius: 3px;
            padding: 3px 6px;
            font-size: 11px;
            user-select: text;
            -webkit-user-select: text;
        }

        .bar-input {
            width: 120px;
        }

        .bar-select {
            max-width: 220px;
        }

        button.tool-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-soft);
            border-radius: 3px;
            padding: 4px 7px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        button.tool-btn:hover:not(:disabled) {
            background-color: var(--bg-card-hover);
            border-color: var(--text-main);
        }

        button.tool-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        button.tool-btn.active {
            background-color: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }

        body.sim-active .btn-sim-start {
            background-color: #22c55e !important;
            border-color: #22c55e !important;
            color: #000000 !important;
        }

        body.sim-active .btn-sim-stop {
            background-color: #ef4444 !important;
            border-color: #ef4444 !important;
            color: #ffffff !important;
        }

        .main-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .canvas-wrap {
            flex: 1;
            position: relative;
            overflow: auto;
            background-color: #121212;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
            touch-action: none;
        }

        .sheet-box {
            display: inline-block;
            transform-origin: top left;
            background-color: var(--sheet-bg);
            border: 2px solid #000000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
        }

        canvas {
            display: block;
            background-color: var(--sheet-bg);
            touch-action: none;
        }

        .floating-win {
            position: absolute;
            width: 280px;
            max-width: calc(100vw - 20px);
            max-height: calc(100% - 20px);
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 35;
        }

        .floating-win.hidden {
            display: none;
        }

        .win-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-soft);
            cursor: grab;
            touch-action: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
        }

        .win-header:active {
            cursor: grabbing;
        }

        .win-close {
            background: transparent;
            border: 1px solid var(--border-soft);
            color: var(--text-main);
            border-radius: 3px;
            padding: 1px 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .win-close:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .win-body {
            padding: 8px;
            overflow: auto;
            flex: 1;
            font-size: 11.5px;
        }

        .prop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .prop-field {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 6px;
        }

        .prop-field label {
            color: var(--text-muted);
            font-size: 10.5px;
        }

        .prop-field input, .prop-field select {
            width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            border: 1px solid var(--border-soft);
            border-radius: 3px;
            padding: 4px 6px;
            font-size: 11.5px;
            user-select: text;
            -webkit-user-select: text;
        }

        .prop-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .panel-bottom {
            height: 110px;
            min-height: 68px;
            max-height: 220px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            font-size: 11px;
        }

        .panel-bottom.hidden {
            display: none;
        }

        .bottom-tabs {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
            background-color: var(--bg-app);
            border-bottom: 1px solid var(--border-soft);
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #ffffff;
            border-color: #ffffff;
            color: #000000;
            font-weight: 700;
        }

        .bottom-body {
            flex: 1;
            overflow: auto;
            padding: 6px 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px;
            line-height: 1.4;
        }

        .statusbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 10px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-soft);
            font-size: 11px;
            color: var(--text-muted);
        }

        .statusbar strong {
            color: var(--text-main);
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 120;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            overflow: auto;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px;
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-soft);
        }

        .modal-content {
            font-size: 12px;
            line-height: 1.5;
        }

        @media print {
            body {
                height: auto;
                overflow: visible;
                background: #ffffff !important;
                color: #000000 !important;
            }
            .menubar, .top-strip, .quickbar, .panel-bottom, .statusbar, .floating-win, .modal-backdrop {
                display: none !important;
            }
            .main-shell, .workspace, .canvas-wrap {
                overflow: visible !important;
                padding: 0 !important;
                background: #ffffff !important;
            }
            .sheet-box {
                transform: none !important;
                border: none !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>

    <nav class="menubar" id="menubar">
        <span class="brand-tag">XANDER ELECTROSIM v1.0</span>

        <div class="menu-item">
            <button class="menu-btn" data-menu="file">Ficheiro</button>
            <div class="dropdown" id="menu-file">
                <button onclick="novoProjeto()">Novo projeto</button>
                <button onclick="limparArea()">Novo circuito</button>
                <button onclick="document.getElementById('fileInput').click()">Abrir projeto (.xsim / .json)</button>
                <button onclick="carregarAutoSave()">Abrir projeto recente</button>
                <div class="dropdown-sep"></div>
                <button onclick="guardarLocal()">Guardar no armazenamento</button>
                <button onclick="exportarJSON()">Guardar como (.xsim)</button>
                <button onclick="toggleAutoSave()">Guardar automaticamente <span id="lblAutoSave">[ON]</span></button>
                <div class="dropdown-sep"></div>
                <button onclick="exportarImagem('image/png')">Guardar como PNG</button>
                <button onclick="exportarImagem('image/jpeg')">Guardar como JPG</button>
                <button onclick="exportarPDF()">Guardar em ficheiro PDF</button>
                <button onclick="window.print()">Imprimir esquema</button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="edit">Editar</button>
            <div class="dropdown" id="menu-edit">
                <button onclick="desfazer()">Desfazer (Ctrl+Z)</button>
                <button onclick="refazer()">Refazer (Ctrl+Y)</button>
                <div class="dropdown-sep"></div>
                <button onclick="copiarSelecionado(true)">Cortar</button>
                <button onclick="copiarSelecionado(false)">Copiar (Ctrl+C)</button>
                <button onclick="colarComponente()">Colar (Ctrl+V)</button>
                <button onclick="duplicarSelecionado()">Duplicar</button>
                <button onclick="eliminarSelecionado()">Eliminar (Del)</button>
                <div class="dropdown-sep"></div>
                <button onclick="rodarSelecionado()">Rodar 90° (R)</button>
                <button onclick="alternarBloqueio()">Bloquear / Desbloquear</button>
                <button onclick="eliminarUltimaLigacao()">Eliminar última ligação</button>
                <button onclick="limparArea()">Limpar área de trabalho</button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="view">Visualizar</button>
            <div class="dropdown" id="menu-view">
                <button onclick="toggleMenuFerramentas()">Mostrar / Recolher ferramentas</button>
                <button onclick="alterarZoom(0.15)">Ampliar (Zoom +)</button>
                <button onclick="alterarZoom(-0.15)">Reduzir (Zoom -)</button>
                <button onclick="resetZoom()">Zoom 100%</button>
                <button onclick="centralizarCanvas()">Centralizar área de trabalho</button>
                <div class="dropdown-sep"></div>
                <button onclick="toggleGrelha()">Mostrar / Ocultar grelha</button>
                <button onclick="toggleSnap()">Encaixe à grelha <span id="lblSnap">[ON]</span></button>
                <button onclick="toggleTema()">Alternar tema claro / escuro</button>
                <button onclick="alternarModoDesktopHorizontal()">Modo Desktop / Horizontal <span id="lblDesktop">[OFF]</span></button>
                <div class="dropdown-sep"></div>
                <button onclick="abrirJanela('winPropriedades')">Janela Propriedades</button>
                <button onclick="togglePainelInferior()">Painel Diagnóstico</button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="insert">Inserir</button>
            <div class="dropdown" id="menu-insert">
                <button onclick="inserirComponenteSelecionado()">Inserir componente escolhido</button>
                <button onclick="setFerramenta('wire')">Inserir ligação</button>
                <button onclick="adicionarNota('TITULO')">Inserir título</button>
                <button onclick="adicionarNota('TEXTO')">Inserir texto</button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="tools">Ferramentas</button>
            <div class="dropdown" id="menu-tools">
                <button onclick="setFerramenta('select')">Selecionar / Mover</button>
                <button onclick="setFerramenta('wire')">Desenhar ligação</button>
                <button onclick="setFerramenta('delete')">Apagar elemento</button>
                <div class="dropdown-sep"></div>
                <button onclick="renumerarTags()">Numeração automática de TAGs</button>
                <button onclick="verificarLigacoes()">Verificação de ligações</button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="sim">Simulação</button>
            <div class="dropdown" id="menu-sim">
                <button onclick="iniciarSimulacao(true)">Iniciar simulação</button>
                <button onclick="pausarSimulacao()">Pausar / Continuar</button>
                <button onclick="iniciarSimulacao(false)">Parar simulação</button>
                <button onclick="reiniciarSimulacao()">Reiniciar simulação</button>
                <div class="dropdown-sep"></div>
                <button onclick="toggleFluxoCorrente()">Mostrar fluxo de corrente <span id="lblFluxo">[ON]</span></button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="analysis">Análise</button>
            <div class="dropdown" id="menu-analysis">
                <button onclick="executarAnalise('TENSAO')">Análise de tensão</button>
                <button onclick="executarAnalise('CORRENTE')">Análise de potência</button>
                <button onclick="executarAnalise('CONTINUIDADE')">Análise de continuidade</button>
                <button onclick="verificarLigacoes()">Diagnóstico de ligações</button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="projects">Projetos / Modelos</button>
            <div class="dropdown" id="menu-projects">
                <button onclick="carregarModeloProjeto('DIRETO')">Arranque direto (Força + Comando)</button>
                <button onclick="carregarModeloProjeto('ESTRELA_TRIANGULO')">Arranque estrela-triângulo Y/Δ (Força + Comando)</button>
                <button onclick="carregarModeloProjeto('INVERSAO')">Arranque inversão de marcha (Força + Comando)</button>
                <button onclick="carregarModeloProjeto('SEQUENCIAL')">Acionamento sequencial c/ temporizadores (Força + Comando)</button>
                <button onclick="carregarModeloProjeto('CICLICO_ALARME')">Acionamento cíclico c/ alarme sonoro (Força + Comando)</button>
                <button onclick="carregarModeloProjeto('BOMBA_SENSOR')">Acionamento c/ sensor e proteção (Força + Comando)</button>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" data-menu="help">Ajuda</button>
            <div class="dropdown" id="menu-help">
                <button onclick="abrirModal('Dicas e Atalhos', `<p>• <b>Duplo clique na folha</b>: Retângulo de seleção múltipla (arrasta para o lado oposto).</p><p>• <b>Ctrl+C / Ctrl+V</b>: Copiar e colar seleção | <b>R</b>: Rodar 90° | <b>Del</b>: Apagar.</p><p>• <b>Roda do rato</b>: Zoom direto na folha (ou pinça com dois dedos).</p>`)">Como usar</button>
                <button onclick="abrirModal('Sobre', `<p><b>Xander ElectroSim v1.0</b> — Simulador de esquemas elétricos industriais, eletrónica, eletropneumática e hidráulica.</p>`)">Sobre</button>
            </div>
        </div>

        <input type="file" id="fileInput" accept=".xsim,.json" style="display:none" onchange="importarJSON(event)">
    </nav>

    <div class="top-strip">
        <div class="strip-left">
            <button class="tool-btn active" id="btnToggleToolsMenu" onclick="toggleMenuFerramentas()">☰ Ferramentas</button>
            <button class="tool-btn active" id="toolSelect" onclick="setFerramenta('select')">Selecionar</button>
            <button class="tool-btn" id="toolWire" onclick="setFerramenta('wire')">Ligar</button>
            <button class="tool-btn" id="toolDelete" onclick="setFerramenta('delete')">Apagar Fio/Peça</button>
            <button class="tool-btn" id="btnToggleProp" onclick="toggleJanela('winPropriedades')">Propriedades</button>

            <span class="strip-sep"></span>

            <button class="tool-btn" onclick="novoProjeto()">Novo</button>
            <button class="tool-btn" onclick="guardarLocal()">Guardar</button>
            <button class="tool-btn" id="btnUndo" onclick="desfazer()" disabled>↩</button>
            <button class="tool-btn" id="btnRedo" onclick="refazer()" disabled>↪</button>
            <button class="tool-btn" onclick="duplicarSelecionado()">Duplicar</button>
            <button class="tool-btn" onclick="eliminarSelecionado()">Apagar</button>
            <button class="tool-btn" onclick="rodarSelecionado()">↻ 90°</button>
            <button class="tool-btn" onclick="alternarBloqueio()">Bloquear</button>
            <button class="tool-btn" id="btnZoom" onclick="resetZoom()">100%</button>
            <button class="tool-btn active" id="btnGrid" onclick="toggleGrelha()">Grelha</button>
        </div>
        <div class="strip-right">
            <button class="tool-btn" id="btnDesktopMode" onclick="alternarModoDesktopHorizontal()">Desktop Horiz.</button>
            <button class="tool-btn" id="btnPause" onclick="pausarSimulacao()" disabled>⏸ Pausa</button>
            <button class="tool-btn" id="btnRestartTop" onclick="reiniciarSimulacao()">↺ Reiniciar</button>
            <button class="tool-btn btn-sim-start" id="btnSimToggle" onclick="alternarSimulacao()">▶ Simular</button>
        </div>
    </div>

    <div class="quickbar" id="quickbar" aria-label="Menu de ferramentas">
        <div class="tool-group">
            <span class="group-label">Componentes</span>
            <input type="text" id="searchComp" class="bar-input" placeholder="Pesquisar..." oninput="atualizarListaComponentesBarra()">
            <select id="catFilter" class="bar-select" onchange="atualizarListaComponentesBarra()">
                <option value="TODAS">Todas as categorias</option>
                <option value="ALIMENTACAO">Alimentação elétrica</option>
                <option value="MOTORES">Motores e acionamentos</option>
                <option value="CONTACTORES">Contactores</option>
                <option value="RELES">Relés</option>
                <option value="TEMPORIZADORES">Temporizadores</option>
                <option value="PROTECAO">Disjuntores e proteção</option>
                <option value="COMANDOS">Botões e comandos</option>
                <option value="SINALIZACAO">Sinalização e medição</option>
                <option value="SENSORES">Sensores</option>
                <option value="PNEUMATICA">Pneumáticos</option>
                <option value="HIDRAULICA">Hidráulicos</option>
                <option value="LOGICA">Lógicos e especiais</option>
                <option value="LIGACAO">Ligação e acessórios</option>
            </select>
            <select id="compSelectBar" class="bar-select" onchange="onSelectComponenteMudou()"></select>
            <button class="tool-btn" onclick="inserirComponenteSelecionado()">+ Inserir</button>
        </div>
    </div>

    <div class="main-shell">
        <div class="workspace" id="workspace">
            <div class="floating-win hidden" id="winPropriedades" style="right: 12px; top: 12px;">
                <div class="win-header" data-drag-win="winPropriedades">
                    <span>Propriedades</span>
                    <button class="win-close" onclick="toggleJanela('winPropriedades')">✕</button>

        function atualizarSomSirene(sireneAtiva) {
            const deveTocar = modoSim && !simPausada && sireneAtiva;
            if (!deveTocar) {
                if (sireneGain && audioCtx) {
                    try { sireneGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.02); } catch (e) {}
                }
                return;
            }

            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                if (!audioCtx) audioCtx = new AudioContextClass();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                if (!sireneOsc) {
                    sireneOsc = audioCtx.createOscillator();
                    sireneGain = audioCtx.createGain();
                    sireneLfo = audioCtx.createOscillator();
                    const lfoGain = audioCtx.createGain();

                    sireneOsc.type = 'sawtooth';
                    sireneOsc.frequency.value = 680;

                    sireneLfo.type = 'sine';
                    sireneLfo.frequency.value = 4;
                    lfoGain.gain.value = 140;

                    sireneGain.gain.value = 0.08;

                    sireneLfo.connect(lfoGain);
                    lfoGain.connect(sireneOsc.frequency);
                    sireneOsc.connect(sireneGain);
                    sireneGain.connect(audioCtx.destination);

                    sireneOsc.start();
                    sireneLfo.start();
                } else {
                    sireneGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.02);
                }
            } catch (e) {}
        }

            btn.classList.toggle('active', vaiAbrir);
            btn.textContent = vaiAbrir ? '▲ Ferramentas' : '☰ Ferramentas';
        }

        let winDrag = null;
        document.querySelectorAll('[data-drag-win]').forEach(header => {
            header.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.win-close')) return;
                const win = document.getElementById(header.dataset.dragWin);
                if (!win) return;
                document.querySelectorAll('.floating-win').forEach(w => w.style.zIndex = '35');
                win.style.zIndex = '38';

                const rect = win.getBoundingClientRect();
                const wsRect = workspace.getBoundingClientRect();
                win.style.left = (rect.left - wsRect.left) + 'px';
                win.style.top = (rect.top - wsRect.top) + 'px';
                win.style.right = 'auto';

                winDrag = {
                    win,
                    startX: e.clientX,
                    startY: e.clientY,
                    origLeft: rect.left - wsRect.left,
                    origTop: rect.top - wsRect.top
                };
                header.setPointerCapture(e.pointerId);
            });

            header.addEventListener('pointermove', (e) => {
                if (!winDrag) return;
                const wsRect = workspace.getBoundingClientRect();
                const maxX = Math.max(0, wsRect.width - winDrag.win.offsetWidth);
                const maxY = Math.max(0, wsRect.height - winDrag.win.offsetHeight);
                const nx = Math.max(0, Math.min(maxX, winDrag.origLeft + (e.clientX - winDrag.startX)));
                const ny = Math.max(0, Math.min(maxY, winDrag.origTop + (e.clientY - winDrag.startY)));
                winDrag.win.style.left = nx + 'px';
                winDrag.win.style.top = ny + 'px';
            });

            header.addEventListener('pointerup', () => { winDrag = null; });
            header.addEventListener('pointercancel', () => { winDrag = null; });
        });

        const DEF_MAP = Object.fromEntries(CATALOGO.map(d => [d.tipo, d]));

        function atualizarListaComponentesBarra() {
            const termo = (document.getElementById('searchComp').value || '').trim().toLowerCase();
            const cat = document.getElementById('catFilter').value;
            const sel = document.getElementById('compSelectBar');
            const anterior = sel.value;

            const itens = CATALOGO.filter(item => {
                const okCat = cat === 'TODAS' || item.cat === cat;
                const okTxt = !termo || item.nome.toLowerCase().includes(termo) || item.cod.toLowerCase().includes(termo);
                return okCat && okTxt;
            });

            sel.innerHTML = '';
            itens.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.tipo;
                opt.textContent = `${item.nome} (${item.cod})`;
                sel.appendChild(opt);
            });

            if (itens.some(i => i.tipo === anterior)) {
                sel.value = anterior;
            }
        }

        function onSelectComponenteMudou() {
            inserirComponenteSelecionado();
        }

        function inserirComponenteSelecionado() {
            const tipo = document.getElementById('compSelectBar').value;
            if (tipo) adicionarComponente(tipo, true);
        }

        function normalizar(c) {
            const def = DEF_MAP[c.tipo] || CATALOGO[0];
            return {
                ...c,
                nome: c.nome || def.nome,
                cod: c.cod || def.cod,
                cat: c.cat || def.cat,
                w: c.w || def.w,
                h: c.h || def.h,
                tensao: c.tensao ?? def.tensao ?? 230,
                corrente: c.corrente ?? def.corrente ?? 1,
                tempoSeg: c.tempoSeg ?? def.tempoSeg ?? 3,
                corLed: c.corLed || def.corLed || '#22c55e',
                pinos: Array.isArray(c.pinos) && c.pinos.length ? c.pinos : def.pinos.map(p => ({ ...p })),
                rotacao: c.rotacao || 0,
                bloqueado: !!c.bloqueado,
                ativo: !!c.ativo,
                impulso: !!c.impulso,
                energizado: !!c.energizado,
                sentidoRotacao: c.sentidoRotacao || 0,
                tempoAtual: c.tempoAtual || 0,
                concluido: !!c.concluido
            };
        }

        function aplicarZoomNoPonto(novoZoom, clientX, clientY) {
            const clamped = Math.max(0.4, Math.min(2.2, +novoZoom.toFixed(2)));
            if (clamped === zoom) return;

            const rect = canvasWrap.getBoundingClientRect();
            const relX = (typeof clientX === 'number') ? (clientX - rect.left) : (canvasWrap.clientWidth / 2);
            const relY = (typeof clientY === 'number') ? (clientY - rect.top) : (canvasWrap.clientHeight / 2);

            const mundoX = (canvasWrap.scrollLeft + relX) / zoom;
            const mundoY = (canvasWrap.scrollTop + relY) / zoom;

            zoom = clamped;
            sheetBox.style.transform = `scale(${zoom})`;
            const pct = `${Math.round(zoom * 100)}%`;
            document.getElementById('btnZoom').textContent = pct;
            document.getElementById('stZoom').textContent = pct;

            canvasWrap.scrollLeft = Math.max(0, mundoX * zoom - relX);
            canvasWrap.scrollTop = Math.max(0, mundoY * zoom - relY);
        }

        function distDoisToques(e) {
            const t = e.touches;
            if (!t || t.length < 2) return null;
            return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        }

        canvasWrap.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                arrastandoGrupo = null;
                selecaoCaixa = null;
                ligandoDe = null;
                pinchDistInicial = distDoisToques(e);
                pinchZoomInicial = zoom;
            }
        }, { passive: true });

        canvasWrap.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && pinchDistInicial) {
                e.preventDefault();
                const distAtual = distDoisToques(e);
                if (!distAtual) return;
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                aplicarZoomNoPonto(pinchZoomInicial * (distAtual / pinchDistInicial), midX, midY);
            }
        }, { passive: false });

        canvasWrap.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) pinchDistInicial = null;
        }, { passive: true });

        canvasWrap.addEventListener('wheel', (e) => {
            e.preventDefault();
            const passo = e.deltaY < 0 ? 0.1 : -0.1;
            aplicarZoomNoPonto(zoom + passo, e.clientX, e.clientY);
        }, { passive: false });

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {

        });

                contadores[base.tagPrefix] = (contadores[base.tagPrefix] || 0) + 1;
                const clone = normalizar({
                    ...base,
                    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    tag: `${base.tagPrefix}${contadores[base.tagPrefix]}`,
                    x: Math.min(canvas.width - base.w, base.x + 40),
                    y: Math.min(canvas.height - base.h, base.y + 40),
                    bloqueado: false
                });
                componentes.push(clone);
                novosIds.add(clone.id);
            });
            invalidarRotasFios();
            selecionadosIds = novosIds;
            selecionadoId = Array.from(novosIds)[0] || null;
            fioSelecionadoIdx = -1;
            renderPropriedades();
            registrarHistorico();
            logMsg(`${novosIds.size} componente(s) colado(s).`);
        }

        function duplicarSelecionado() {
            copiarSelecionado(false);
            colarComponente();

        function eliminarSelecionado() {
            if (modoSim) return;
            if (fioSelecionadoIdx >= 0 && fioSelecionadoIdx < fios.length) {
                fios.splice(fioSelecionadoIdx, 1);
                invalidarRotasFios();
                fioSelecionadoIdx = -1;
                renderPropriedades();
                registrarHistorico();
                logMsg('Condutor eliminado.');
                return;
            }
            const ids = selecionadosIds.size > 0 ? Array.from(selecionadosIds) : (selecionadoId ? [selecionadoId] : []);
            if (!ids.length) return;
            const setIds = new Set(ids);
            fios = fios.filter(f => !setIds.has(f.deComp) && !setIds.has(f.paraComp));
            componentes = componentes.filter(c => !setIds.has(c.id));
            invalidarRotasFios();
            selecionadosIds.clear();
            selecionadoId = null;
            renderPropriedades();
            registrarHistorico();
            logMsg(`${ids.length} componente(s) eliminado(s).`);
        }

        function eliminarUltimaLigacao() {
            if (modoSim || fios.length === 0) return;

        function registrarHistorico() {
            const snap = JSON.stringify({ componentes, fios, notas, contadores });
            if (histIdx >= 0 && historico[histIdx] === snap) return;
            historico = historico.slice(0, histIdx + 1);
            historico.push(snap);
            histIdx = historico.length - 1;
            atualizarBotoesHist();
            if (autoSave) guardarLocal(true);
            atualizarBarraEstado();

        function atualizarBotoesHist() {
            document.getElementById('btnUndo').disabled = histIdx <= 0 || modoSim;

        }

        function desfazer() {
            if (histIdx <= 0 || modoSim) return;
            histIdx--;
            aplicarSnapshot(historico[histIdx]);
        }

        function refazer() {
            if (histIdx >= historico.length - 1 || modoSim) return;
            histIdx++;
            aplicarSnapshot(historico[histIdx]);
        }

        async function guardarLocal(silencioso = false) {
            const payload = construirPayloadProjeto();
            try {

                document.getElementById('stSave').textContent = 'Guardado';
            } catch (e) {}

            if (silencioso) return;

            const nomeBase = (document.getElementById('stProjeto').textContent || 'esquema').replace(/[^a-zA-Z0-9_-]/g, '_');
            const nomeFicheiro = `${nomeBase}.xsim`;

            if (typeof window.showSaveFilePicker === 'function') {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: nomeFicheiro,
                        types: [{ description: 'Projeto Xander ElectroSim', accept: { 'application/json': ['.xsim', '.json'] } }]
                    });
                    fileHandleAtual = handle;

                    document.getElementById('stSave').textContent = `Guardado (${handle.name})`;
                    logMsg(`Projeto guardado em ${handle.name}.`);
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') {

            const blob = new Blob([payload], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = nomeFicheiro;
            a.click();

            logMsg(`Projeto guardado como ${nomeFicheiro}.`);

        function gerarCanvasRecortado(incluirGrelha = false) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            componentes.forEach(c => {
                minX = Math.min(minX, c.x - 20);
                minY = Math.min(minY, c.y - 20);
                maxX = Math.max(maxX, c.x + c.w + 20);
                maxY = Math.max(maxY, c.y + c.h + 20);
            });
            notas.forEach(n => {
                minX = Math.min(minX, n.x - 10);
                minY = Math.min(minY, n.y - 20);
                maxX = Math.max(maxX, n.x + 180);
                maxY = Math.max(maxY, n.y + 20);
            });

            if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 600; maxY = 400; }
            else {
                minX = Math.max(0, minX - 30);
                minY = Math.max(0, minY - 30);
                maxX = Math.min(canvas.width, maxX + 30);
                maxY = Math.min(canvas.height, maxY + 30);
            }

            const w = Math.max(120, Math.round(maxX - minX));
            const h = Math.max(120, Math.round(maxY - minY));
            const temp = document.createElement('canvas');
            temp.width = w; temp.height = h;
            const tctx = temp.getContext('2d');
            tctx.fillStyle = '#ffffff';
            tctx.fillRect(0, 0, w, h);

            if (incluirGrelha && mostrarGrelha) {
                tctx.strokeStyle = '#efefef';
                tctx.lineWidth = 1;
                const startX = Math.floor(minX / GRID) * GRID;
                const startY = Math.floor(minY / GRID) * GRID;
                for (let x = startX; x <= maxX; x += GRID) { tctx.beginPath(); tctx.moveTo(x - minX, 0); tctx.lineTo(x - minX, h); tctx.stroke(); }
                for (let y = startY; y <= maxY; y += GRID) { tctx.beginPath(); tctx.moveTo(0, y - minY); tctx.lineTo(w, y - minY); tctx.stroke(); }
            }

            tctx.drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
            return temp;
        }

        function exportarPDF() {
            const recortado = gerarCanvasRecortado(false);
            const jpegDataUrl = recortado.toDataURL('image/jpeg', 0.92);
            const base64 = jpegDataUrl.split(',')[1];
            const binary = atob(base64);
            const jpgBytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) jpgBytes[i] = binary.charCodeAt(i);

            const imgW = recortado.width, imgH = recortado.height;
            const pageW = 842, pageH = 595, margin = 36;
            const scale = Math.min((pageW - margin * 2) / imgW, (pageH - margin * 2) / imgH);
            const drawW = +(imgW * scale).toFixed(2), drawH = +(imgH * scale).toFixed(2);
            const drawX = +((pageW - drawW) / 2).toFixed(2), drawY = +((pageH - drawH) / 2).toFixed(2);

            const streamContent = `q ${drawW} 0 0 ${drawH} ${drawX} ${drawY} cm /Im0 Do Q`;
            const enc = new TextEncoder();
            const parts = [], offsets = [];
            let len = 0;
            const pushStr = (s) => { const b = enc.encode(s); parts.push(b); len += b.length; };
            const pushBytes = (b) => { parts.push(b); len += b.length; };

            pushStr('%PDF-1.4\n');
            offsets[1] = len; pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
            offsets[2] = len; pushStr('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
            offsets[3] = len; pushStr(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
            offsets[4] = len; pushStr(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgBytes.length} >>\nstream\n`);
            pushBytes(jpgBytes);
            pushStr('\nendstream\nendobj\n');
            offsets[5] = len; pushStr(`5 0 obj\n<< /Length ${streamContent.length} >>\nstream\n${streamContent}\nendstream\nendobj\n`);

            const xrefPos = len;
            pushStr(`xref\n0 6\n0000000000 65535 f \n`);
            for (let i = 1; i <= 5; i++) pushStr(`${String(offsets[i]).padStart(10, '0')} 00000 n \n`);
            pushStr(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);

            const blob = new Blob(parts, { type: 'application/pdf' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'circuito-electrosim.pdf';
            a.click();
            logMsg('PDF guardado (circuito-electrosim.pdf).');
        }
