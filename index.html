        function bobinaOuComandoAtivoPorTag(tag) {
            return componentes.some(c =>
                c.tag === tag &&
                (
                    (TIPOS_BOBINA.has(c.tipo) && c.energizado) ||
                    (['RELE_IMPULSO', 'RELE_BIESTAVEL', 'RELE_MEMORIA', 'RELE_ALTERNANCIA'].includes(c.tipo) && c.impulso) ||
                    (TIPOS_TEMP.has(c.tipo) && c.concluido)
                )
            );
        }

        function contactoFechado(c) {
            if (TIPOS_NF.has(c.tipo)) {
                if (TIPOS_PULSO.has(c.tipo) || TIPOS_CHAVE.has(c.tipo)) return !c.ativo;
                return !bobinaOuComandoAtivoPorTag(c.tag);
            }
            if (c.tipo === 'CONT_TEMP_NA') {
                const t = componentes.find(x => x.tag === c.tag && TIPOS_TEMP.has(x.tipo));
                return !!(t && t.concluido);
            }
            if (['BOT_START', 'BOT_DUPLO', 'BOT_SEM_RETENCAO', 'FIM_CURSO', 'INT_PEDAL'].includes(c.tipo)) {
                return !!c.ativo;
            }
            if (['CONT_NA', 'CONT_3P', 'CONT_4P'].includes(c.tipo)) {
                return bobinaOuComandoAtivoPorTag(c.tag);
            }
            if (TIPOS_CHAVE.has(c.tipo)) {
                return !!c.ativo;
            }
            return false;
        }

        function resolverCircuito(dt) {
            if (!modoSim) {
                atualizarSomSirene(false);
                return new Set();
            }
            if (simPausada) {
                atualizarSomSirene(false);
                dt = 0;
            }

            for (let passo = 0; passo < 3; passo++) {
                const adj = {};
                const ligar = (a, b) => {
                    (adj[a] = adj[a] || []).push(b);
                    (adj[b] = adj[b] || []).push(a);
                };

                fios.forEach(f => ligar(`${f.deComp}:${f.dePino}`, `${f.paraComp}:${f.paraPino}`));

                componentes.forEach(c => {
                    if ([
                        'FUSIVEL', 'FUS_ULTRARRAPIDO', 'FUS_NH', 'FUS_CILINDRICO',
                        'BORNE', 'REGUA_BORNES', 'PONTE_BORNES', 'LIGACAO_CRUZADA',
                        'PONTO_JUNCAO', 'CON_MULTIPOLAR', 'CON_RAPIDO', 'FICHA_MACHO',
                        'FICHA_FEMEA', 'TOMADA_PAINEL', 'AMPERIMETRO', 'RES_ARRANQUE',
                        'RES_FRENAGEM', 'UNID_FRENAGEM', 'DIODO', 'DIODO_ZENER', 'DIAC'
                    ].includes(c.tipo)) {
                        if (c.pinos.length >= 2) ligar(`${c.id}:0`, `${c.id}:1`);
                    } else if (['DJ_1P', 'SECCIONADOR', 'SECC_FUSIVEL', 'INT_GERAL'].includes(c.tipo)) {
                        if (c.ativo && c.pinos.length >= 2) ligar(`${c.id}:0`, `${c.id}:1`);
                    } else if (['DJ_2P', 'INT_DIFERENCIAL', 'DJ_SELETIVO'].includes(c.tipo)) {
                        if (c.ativo && c.pinos.length >= 4) {
                            ligar(`${c.id}:0`, `${c.id}:2`);
                            ligar(`${c.id}:1`, `${c.id}:3`);
                        }
                    } else if (['DJ_3P', 'DJ_MOTOR'].includes(c.tipo)) {
                        if (c.ativo && c.pinos.length >= 6) {
                            ligar(`${c.id}:0`, `${c.id}:3`);
                            ligar(`${c.id}:1`, `${c.id}:4`);
                            ligar(`${c.id}:2`, `${c.id}:5`);
                        }
                    } else if (c.tipo === 'CONT_3P' || c.tipo === 'BOT_TRIPLO') {
                        if (contactoFechado(c) && c.pinos.length >= 6) {
                            ligar(`${c.id}:0`, `${c.id}:3`);
                            ligar(`${c.id}:1`, `${c.id}:4`);
                            ligar(`${c.id}:2`, `${c.id}:5`);
                        }
                    } else if (c.tipo === 'CONT_4P') {
                        if (contactoFechado(c) && c.pinos.length >= 8) {
                            for (let k = 0; k < 4; k++) ligar(`${c.id}:${k}`, `${c.id}:${k + 4}`);
                        }
                    } else if (['COM_2POS', 'COM_FONTES'].includes(c.tipo) && c.pinos.length >= 3) {
                        if (!c.ativo) ligar(`${c.id}:0`, `${c.id}:1`);
                        else ligar(`${c.id}:0`, `${c.id}:2`);
                    } else if (
                        TIPOS_NF.has(c.tipo) ||
                        ['BOT_START', 'BOT_DUPLO', 'BOT_SEM_RETENCAO', 'FIM_CURSO', 'INT_PEDAL', 'CONT_NA', 'CONT_TEMP_NA'].includes(c.tipo) ||
                        TIPOS_CHAVE.has(c.tipo)
                    ) {
                        if (contactoFechado(c) && c.pinos.length >= 2) ligar(`${c.id}:0`, `${c.id}:1`);
                    }
                });

                const gruposFase = [];
                const gruposRetorno = [];
                const visitadosGlobal = new Set();
                const fasePorPino = new Map();

                const fontes = componentes.filter(c =>
                    c.tipo.startsWith('FONTE_') ||
                    c.tipo.startsWith('TRANSF_') ||
                    ['GERADOR_ELETRICO', 'ALTERNADOR', 'AUTOTRANSF', 'BATERIA', 'ACUMULADOR_ELET'].includes(c.tipo)
                );

                fontes.forEach(f => {
                    f.pinos.forEach((p, idx) => {
                        const startKey = `${f.id}:${idx}`;
                        if (visitadosGlobal.has(startKey)) return;
                        const compSet = new Set();
                        const fila = [startKey];
                        compSet.add(startKey);
                        visitadosGlobal.add(startKey);

                        const faseId = p.nome || `F${idx}`;
                        while (fila.length) {
                            const cur = fila.shift();
                            if (!fasePorPino.has(cur)) fasePorPino.set(cur, faseId);
                            for (const nxt of (adj[cur] || [])) {
                                if (!compSet.has(nxt)) {
                                    compSet.add(nxt);
                                    visitadosGlobal.add(nxt);
                                    fila.push(nxt);
                                }
                            }
                        }

                        const ehRetorno = /N|PE|-|0V/i.test(p.nome) || (idx === f.pinos.length - 1 && f.pinos.length >= 2 && f.tipo === 'FONTE_1F');
                        if (ehRetorno) gruposRetorno.push(compSet);
                        else gruposFase.push(compSet);
                    });
                });

                const livePins = new Set();
                gruposFase.forEach(g => g.forEach(k => livePins.add(k)));

                componentes.forEach(c => {
                    if (['MOT_TRI_3P', 'MOT_TRI', 'MOT_DAHLANDER', 'MOT_SINCRONO'].includes(c.tipo)) {
                        const fasesAtivas = [0, 1, 2].filter(i => livePins.has(`${c.id}:${i}`)).length;
                        const retornosAtivos = c.pinos.length >= 6 ? [3, 4, 5].filter(i => livePins.has(`${c.id}:${i}`)).length : 0;
                        c.energizado = fasesAtivas >= 2 || (fasesAtivas >= 1 && retornosAtivos >= 1);

                        if (c.energizado && fasesAtivas === 3) {
                            const seq = [0, 1, 2].map(i => fasePorPino.get(`${c.id}:${i}`)).join('-');
                            if (seq === 'L1-L2-L3' || seq === 'L2-L3-L1' || seq === 'L3-L1-L2') c.sentidoRotacao = 1;
                            else if (seq === 'L3-L2-L1' || seq === 'L1-L3-L2' || seq === 'L2-L1-L3') c.sentidoRotacao = -1;
                            else c.sentidoRotacao = 1;
                        } else if (c.energizado) {
                            c.sentidoRotacao = 1;
                        } else {
                            c.sentidoRotacao = 0;
                        }
                    } else if (TIPOS_CARGA.has(c.tipo) && c.pinos.length >= 2) {
                        const k0 = `${c.id}:0`;
                        const k1 = `${c.id}:1`;
                        const emFase = gruposFase.some(g => g.has(k0) || g.has(k1));
                        const emRetorno = gruposRetorno.some(g => g.has(k0) || g.has(k1));
                        const ambosNoMesmoGrupo = gruposFase.some(g => g.has(k0) && g.has(k1));
                        c.energizado = (emFase && emRetorno && !ambosNoMesmoGrupo) || livePins.has(k0) || livePins.has(k1);
                    } else {
                        c.energizado = c.pinos.some((_, i) => livePins.has(`${c.id}:${i}`));
                    }

                    if (passo === 2 && TIPOS_TEMP.has(c.tipo) && !simPausada) {
                        if (c.tipo === 'TEMP_CICLICO') {
                            if (c.energizado) {
                                c.tempoAtual += dt;
                                if (c.tempoAtual >= c.tempoSeg) { c.tempoAtual = 0; c.concluido = !c.concluido; }
                            } else { c.tempoAtual = 0; c.concluido = false; }
                        } else if (c.tipo === 'TEMP_TOFF' || c.tipo === 'RELE_TEMPO_ABR') {
                            if (c.energizado) { c.tempoAtual = c.tempoSeg; c.concluido = true; }
                            else if (c.tempoAtual > 0) {
                                c.tempoAtual = Math.max(0, c.tempoAtual - dt);
                                if (c.tempoAtual === 0) c.concluido = false;
                            }
                        } else {
                            if (c.energizado) {
                                c.tempoAtual = Math.min(c.tempoSeg, c.tempoAtual + dt);
                                if (c.tempoAtual >= c.tempoSeg) c.concluido = true;
                            } else { c.tempoAtual = 0; c.concluido = false; }
                        }
                    }
                });

                if (passo === 2) {
                    const sireneLigada = componentes.some(c => c.tipo === 'SIRENE' && c.energizado);
                    atualizarSomSirene(sireneLigada);
                    return livePins;
                }
            }
            return new Set();
        }

        // =========================================================================
        // ROTEAMENTO ORTOGONAL A* COM DESVIO DE COMPONENTES E SEPARAÇÃO DE FIOS
        // =========================================================================
        let cacheRotasFios = [];
        let rotasSujas = true;

        function invalidarRotasFios() {
            rotasSujas = true;
        }

        function simplificarPontosOrto(pts) {
            return pts.filter((pt, idx, arr) => {
                if (idx === 0 || idx === arr.length - 1) return true;
                const p = arr[idx - 1];
                const n = arr[idx + 1];
                const mesmoX = Math.abs(p.x - pt.x) < 0.5 && Math.abs(pt.x - n.x) < 0.5;
                const mesmoY = Math.abs(p.y - pt.y) < 0.5 && Math.abs(pt.y - n.y) < 0.5;
                return !(mesmoX || mesmoY);
            });
        }

        function recalcularTodasRotasFios() {
            const cols = Math.ceil(canvas.width / GRID) + 1;
            const rows = Math.ceil(canvas.height / GRID) + 1;
            // 0 = livre, 1 = componente, 2 = fio já existente
            const mapa = Array.from({ length: rows }, () => Array(cols).fill(0));

            const toG = (v) => Math.max(0, Math.round(v / GRID));
            const valido = (r, c) => r >= 0 && r < rows && c >= 0 && c < cols;

            // Bloqueia área de cada componente (+ margem de 1 célula) e libera os seus bornes
            componentes.forEach(comp => {
                const c0 = Math.max(0, toG(comp.x) - 1);
                const c1 = Math.min(cols - 1, toG(comp.x + comp.w) + 1);
                const r0 = Math.max(0, toG(comp.y) - 1);
                const r1 = Math.min(rows - 1, toG(comp.y + comp.h) + 1);

                for (let r = r0; r <= r1; r++) {
                    for (let c = c0; c <= c1; c++) {
                        mapa[r][c] = 1;
                    }
                }

                comp.pinos.forEach(p => {
                    const px = comp.x + p.x;
                    const py = comp.y + p.y;
                    const pc = toG(px);
                    const pr = toG(py);
                    if (valido(pr, pc)) mapa[pr][pc] = 0;

                    if (p.y === 0 && valido(pr - 1, pc)) mapa[pr - 1][pc] = 0;
                    else if (p.y === comp.h && valido(pr + 1, pc)) mapa[pr + 1][pc] = 0;
                    else if (p.x === 0 && valido(pr, pc - 1)) mapa[pr][pc - 1] = 0;
                    else if (p.x === comp.w && valido(pr, pc + 1)) mapa[pr][pc + 1] = 0;
                    else {
                        // Pinos internos (ex: bornes no círculo do motor)
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (valido(pr + dr, pc + dc)) mapa[pr + dr][pc + dc] = 0;
                            }
                        }
                    }
                });
            });

            const dirs = [
                { dr: -1, dc: 0, nome: 'U' },
                { dr: 1, dc: 0, nome: 'D' },
                { dr: 0, dc: -1, nome: 'L' },
                { dr: 0, dc: 1, nome: 'R' }
            ];

            cacheRotasFios = fios.map(f => {
                const c1 = componentes.find(c => c.id === f.deComp);
                const c2 = componentes.find(c => c.id === f.paraComp);
                if (!c1 || !c2) return [];

                const p1 = posPino(c1, f.dePino);
                const p2 = posPino(c2, f.paraPino);

                const start = { r: toG(p1.y), c: toG(p1.x) };
                const goal = { r: toG(p2.y), c: toG(p2.x) };
                if (valido(start.r, start.c)) mapa[start.r][start.c] = 0;
                if (valido(goal.r, goal.c)) mapa[goal.r][goal.c] = 0;

                const open = [{ r: start.r, c: start.c, g: 0, f: Math.abs(start.r - goal.r) + Math.abs(start.c - goal.c), dir: null, parent: null }];
                const melhor = new Map();
                let achado = null;
                let iter = 0;

                while (open.length > 0 && iter < 4500) {
                    iter++;
                    let minIdx = 0;
                    for (let i = 1; i < open.length; i++) {
                        if (open[i].f < open[minIdx].f) minIdx = i;
                    }
                    const curr = open.splice(minIdx, 1)[0];

                    if (curr.r === goal.r && curr.c === goal.c) {
                        achado = curr;
                        break;
                    }

                    const chave = `${curr.r},${curr.c},${curr.dir || 'N'}`;
                    if (melhor.has(chave) && melhor.get(chave) <= curr.g) continue;
                    melhor.set(chave, curr.g);

                    for (const d of dirs) {
                        const nr = curr.r + d.dr;
                        const nc = curr.c + d.dc;
                        if (!valido(nr, nc)) continue;

                        const cel = mapa[nr][nc];
                        const ehFim = nr === goal.r && nc === goal.c;
                        if (cel === 1 && !ehFim) continue;

                        let custo = 1;
                        if (curr.dir && curr.dir !== d.nome) custo += 2.6; // penaliza dobras desnecessárias
                        if (cel === 2) custo += 14; // evita sobrepor outro fio

                        const g = curr.g + custo;
                        const h = Math.abs(nr - goal.r) + Math.abs(nc - goal.c);
                        open.push({ r: nr, c: nc, g, f: g + h, dir: d.nome, parent: curr });
                    }
                }

                let pts;
                if (achado) {
                    const bruto = [];
                    let cur = achado;
                    while (cur) {
                        bruto.unshift({ x: cur.c * GRID, y: cur.r * GRID });
                        cur = cur.parent;
                    }
                    bruto[0] = { x: p1.x, y: p1.y };
                    bruto[bruto.length - 1] = { x: p2.x, y: p2.y };
                    pts = simplificarPontosOrto(bruto);
                } else {
                    const midY = Math.round(((p1.y + p2.y) / 2) / GRID) * GRID;
                    pts = simplificarPontosOrto([
                        { x: p1.x, y: p1.y },
                        { x: p1.x, y: midY },
                        { x: p2.x, y: midY },
                        { x: p2.x, y: p2.y }
                    ]);
                }

                // Marca o trajeto escolhido na grelha para os próximos fios se afastarem
                for (let i = 0; i < pts.length - 1; i++) {
                    const sc1 = toG(pts[i].x), sr1 = toG(pts[i].y);
                    const sc2 = toG(pts[i + 1].x), sr2 = toG(pts[i + 1].y);
                    for (let r = Math.min(sr1, sr2); r <= Math.max(sr1, sr2); r++) {
                        for (let c = Math.min(sc1, sc2); c <= Math.max(sc1, sc2); c++) {
                            if (valido(r, c) && mapa[r][c] === 0) mapa[r][c] = 2;
                        }
                    }
                }

                return pts;
            });

            rotasSujas = false;
        }

        function obterPontosFio(idx) {
            if (rotasSujas) recalcularTodasRotasFios();
            return cacheRotasFios[idx] || [];
        }

        function distanciaPontoSegmento(px, py, ax, ay, bx, by) {
            const dx = bx - ax, dy = by - ay;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) return Math.hypot(px - ax, py - ay);
            const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
            return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
        }

        function encontrarFioEmPonto(mx, my) {
            if (rotasSujas) recalcularTodasRotasFios();
            for (let i = fios.length - 1; i >= 0; i--) {
                const pts = cacheRotasFios[i] || [];
                for (let s = 0; s < pts.length - 1; s++) {
                    if (distanciaPontoSegmento(mx, my, pts[s].x, pts[s].y, pts[s + 1].x, pts[s + 1].y) <= 8) return i;
                }
            }
            return -1;
        }

        function desenharGrelha() {
            if (!mostrarGrelha) return;
            ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= canvas.height; y += GRID) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            ctx.strokeStyle = '#dcdcdc';
            for (let x = 0; x <= canvas.width; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= canvas.height; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
        }

        function posPino(comp, idx) {
            return { x: comp.x + comp.pinos[idx].x, y: comp.y + comp.pinos[idx].y };
        }

        function desenharOndaSenoidal(cx, cy, w, h) {
            ctx.beginPath();
            ctx.moveTo(cx - w / 2, cy);
            ctx.bezierCurveTo(cx - w * 0.25, cy - h, cx - w * 0.05, cy - h, cx, cy);
            ctx.bezierCurveTo(cx + w * 0.05, cy + h, cx + w * 0.25, cy + h, cx + w / 2, cy);
            ctx.stroke();
        }

        function desenharBobinaAcoplada(cx, cy, raio) {
            ctx.beginPath(); ctx.arc(cx, cy, raio, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
        }

        function desenharSimbolo(c) {
            const corSimAtiva = modoSim ? '#dc2626' : '#000000';
            const corSimVerde = modoSim ? '#16a34a' : '#000000';

            ctx.strokeStyle = '#000000';
            ctx.fillStyle = '#000000';
            ctx.lineWidth = 1.6;

            ctx.font = 'bold 10px Arial';
            if (c.tipo === 'CONT_3P' || c.tipo === 'CONT_4P') ctx.fillText(`-${c.tag}`, 0, 44);
            else ctx.fillText(`-${c.tag}`, 2, c.h / 2 + 3);

            if (c.tipo === 'FONTE_1F') {
                [20, 45, 70].forEach((x, idx) => {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 34); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x, 38, 4, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
                    if (idx === 0) { ctx.beginPath(); ctx.moveTo(45, 38); ctx.lineTo(70, 38); ctx.stroke(); }
                });
                ctx.beginPath(); ctx.moveTo(45, 42); ctx.lineTo(45, 80); ctx.stroke();
                return;
            }

            if (c.tipo === 'FONTE_3F') {
                [20, 45, 70].forEach(x => {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 34); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x, 38, 4, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
                });
                ctx.beginPath(); ctx.moveTo(45, 42); ctx.lineTo(45, 80); ctx.stroke();
                return;
            }

            if (c.tipo === 'FONTE_DC') {
                [25, 55].forEach(x => {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 30); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x, 34, 4, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
                });
                ctx.beginPath(); ctx.moveTo(40, 38); ctx.lineTo(40, 70); ctx.stroke();
                return;
            }

            if (c.tipo === 'TRANSF_1F') {
                const cx = 38;
                ctx.beginPath();
                ctx.moveTo(cx, 0); ctx.lineTo(cx, 18); ctx.moveTo(cx, 66); ctx.lineTo(cx, 84);
                ctx.moveTo(cx - 12, 34); ctx.lineTo(cx - 12, 50); ctx.moveTo(cx - 8, 34); ctx.lineTo(cx - 8, 50);
                ctx.stroke();
                desenharBobinaAcoplada(cx, 26, 10); desenharBobinaAcoplada(cx, 58, 10);
                return;
            }

            if (c.tipo === 'TRANSF_3F') {
                [24, 50, 76].forEach(x => {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 20); ctx.moveTo(x, 64); ctx.lineTo(x, 84); ctx.stroke();
                    desenharBobinaAcoplada(x, 28, 9); desenharBobinaAcoplada(x, 56, 9);
                });
                ctx.beginPath(); ctx.moveTo(14, 40); ctx.lineTo(86, 40); ctx.moveTo(14, 44); ctx.lineTo(86, 44); ctx.stroke();
                return;
            }

            if (c.tipo === 'TERRA' || c.tipo === 'TOMADA_TERRA') {
                ctx.beginPath();
                ctx.moveTo(22, 0); ctx.lineTo(22, 22);
                ctx.moveTo(6, 22); ctx.lineTo(38, 22);
                ctx.moveTo(11, 28); ctx.lineTo(33, 28);
                ctx.moveTo(16, 34); ctx.lineTo(28, 34);
                ctx.stroke();
                return;
            }

            if (c.tipo === 'BORNE') {
                ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(20, 20); ctx.moveTo(20, 28); ctx.lineTo(20, 50); ctx.stroke();
                ctx.beginPath(); ctx.arc(20, 24, 4, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
                return;
            }

            if (c.tipo === 'CONT_3P' || c.tipo === 'CONT_4P') {
                const fechado = contactoFechado(c);
                const tops = c.pinos.filter(p => p.y === 0);
                const bots = c.pinos.filter(p => p.y === c.h);
                tops.forEach((p, idx) => {
                    const b = bots[idx];
                    ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, 24);
                    if (b) {
                        ctx.moveTo(b.x, 56); ctx.lineTo(b.x, c.h);
                        ctx.strokeStyle = fechado ? corSimAtiva : '#000000';
                        if (fechado) { ctx.moveTo(p.x, 24); ctx.lineTo(b.x, 56); }
                        else { ctx.moveTo(b.x, 56); ctx.lineTo(p.x - 8, 27); }
                        ctx.strokeStyle = '#000000';
                    }
                    ctx.stroke();
                });
                if (tops.length >= 2) {
                    ctx.save(); ctx.setLineDash([4, 3]);
                    ctx.strokeStyle = fechado ? corSimAtiva : '#000000';
                    ctx.beginPath(); ctx.moveTo(tops[0].x + 2, 41); ctx.lineTo(tops[tops.length - 1].x - 2, 41); ctx.stroke();
                    ctx.restore();
                }
                return;
            }

            if (c.tipo.startsWith('MOT_') || c.tipo === 'SERVOMOTOR') {
                const cx = 54, cy = 52, r = 20;
                const temAnel = (c.tipo === 'MOT_DAHLANDER' || c.tipo === 'MOT_SINCRONO');
                const raioPino = temAnel ? r + 5 : r;

                c.pinos.forEach(p => {
                    const ang = Math.atan2(p.y - cy, p.x - cx);
                    ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * raioPino, cy + Math.sin(ang) * raioPino); ctx.lineTo(p.x, p.y); ctx.stroke();
                });

                if (temAnel) { ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, Math.PI * 2); ctx.stroke(); }

                const dir = c.sentidoRotacao || (c.energizado ? 1 : 0);
                const corAtivaMotor = dir === -1 ? '#2563eb' : corSimVerde;

                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = (modoSim && c.energizado) ? (dir === -1 ? '#dbeafe' : '#dcfce7') : '#ffffff';
                ctx.fill();
                ctx.strokeStyle = (modoSim && c.energizado) ? corAtivaMotor : '#000000';
                ctx.stroke();

                if (c.energizado && !simPausada) anguloRotor += (dir || 1) * 0.14;
                ctx.save();
                ctx.translate(cx, cy); ctx.rotate(anguloRotor);
                ctx.strokeStyle = (modoSim && c.energizado) ? corAtivaMotor : '#000000';
                ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke();
                ctx.restore();

                // Indicador visual do sentido de rotação (Horário ↻ / Anti-Horário ↺)
                if (modoSim && c.energizado && dir !== 0) {
                    ctx.save();
                    ctx.strokeStyle = corAtivaMotor;
                    ctx.fillStyle = corAtivaMotor;
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + 7, -Math.PI * 0.75, -Math.PI * 0.25);
                    ctx.stroke();
                    const tipX = dir === 1 ? cx + (r + 7) * Math.cos(-Math.PI * 0.25) : cx + (r + 7) * Math.cos(-Math.PI * 0.75);
                    const tipY = dir === 1 ? cy + (r + 7) * Math.sin(-Math.PI * 0.25) : cy + (r + 7) * Math.sin(-Math.PI * 0.75);
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 2.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.font = 'bold 8.5px Arial';
                    ctx.fillText(dir === 1 ? 'HOR ↻' : 'ANTI ↺', cx - 16, cy + r + 15);
                    ctx.restore();
                }

                if (c.tipo === 'MOT_MONO_CAP') {
                    const capX = 36, capY = 74;
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(capX - 8, capY - 2, 16, 5);
                    ctx.beginPath(); ctx.moveTo(capX - 8, capY); ctx.lineTo(capX + 8, capY); ctx.moveTo(capX - 8, capY + 4); ctx.lineTo(capX + 8, capY + 4); ctx.stroke();
                }

                ctx.fillStyle = '#000000'; ctx.font = 'bold 8.5px Arial';
                ctx.fillText(c.tipo === 'SERVOMOTOR' ? 'SM' : 'M', cx - 5, cy - 5);
                if (c.tipo.includes('CC') || c.tipo.startsWith('MOT_EXC_')) ctx.fillText('=', cx - 2.5, cy + 8);
                else if (c.tipo.includes('MONO')) { ctx.fillText('1', cx - 2.5, cy + 5); desenharOndaSenoidal(cx, cy + 12, 10, 3.5); }
                else if (!['MOT_PASSO', 'SERVOMOTOR', 'MOT_LINEAR'].includes(c.tipo)) { ctx.fillText('3', cx - 2.5, cy + 5); desenharOndaSenoidal(cx, cy + 12, 10, 3.5); }
                return;
            }

            if (['DJ_1P', 'DJ_2P', 'DJ_3P', 'DJ_MOTOR', 'DJ_SELETIVO', 'INT_DIFERENCIAL', 'SECCIONADOR', 'SECC_FUSIVEL', 'INT_GERAL'].includes(c.tipo)) {
                c.pinos.filter(p => p.y === 0).forEach(p => {
                    const bot = c.pinos.find(b => b.y === c.h && Math.abs(b.x - p.x) < 12);
                    ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, 24);
                    if (bot) {
                        ctx.moveTo(bot.x, 56); ctx.lineTo(bot.x, c.h);
                        if (c.ativo) { ctx.strokeStyle = corSimAtiva; ctx.moveTo(p.x, 24); ctx.lineTo(bot.x, 56); ctx.strokeStyle = '#000000'; }
                        else { ctx.moveTo(bot.x, 56); ctx.lineTo(p.x - 7, 28); }
                    }
                    ctx.stroke();
                    if (!['SECCIONADOR', 'INT_GERAL'].includes(c.tipo)) {
                        const qx = p.x - 16;
                        ctx.beginPath(); ctx.moveTo(qx + 8, 39); ctx.lineTo(p.x - 4, 39); ctx.stroke();
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(qx, 34, 8, 10); ctx.strokeRect(qx, 34, 8, 10);
                    }
                });
                return;
            }

            if (['FUSIVEL', 'FUS_ULTRARRAPIDO', 'FUS_NH', 'FUS_CILINDRICO'].includes(c.tipo)) {
                ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(30, 22); ctx.moveTo(30, 58); ctx.lineTo(30, 80); ctx.stroke();
                ctx.fillStyle = '#ffffff'; ctx.fillRect(22, 22, 16, 36); ctx.strokeRect(22, 22, 16, 36);
                ctx.beginPath(); ctx.moveTo(30, 22); ctx.lineTo(30, 58); ctx.stroke();
                return;
            }

            if (TIPOS_CHAVE.has(c.tipo) || TIPOS_NF.has(c.tipo) || ['BOT_START', 'BOT_DUPLO', 'BOT_SEM_RETENCAO', 'CONT_NA', 'CONT_TEMP_NA'].includes(c.tipo)) {
                const cx = c.tipo === 'BOT_DUPLO' ? 28 : 40;
                const fechado = contactoFechado(c);

                ctx.beginPath();
                ctx.moveTo(cx, 0); ctx.lineTo(cx, 25);
                ctx.moveTo(cx, 55); ctx.lineTo(cx, 80);
                if (fechado) { ctx.strokeStyle = modoSim ? corSimAtiva : '#000000'; ctx.moveTo(cx, 25); ctx.lineTo(cx, 55); }
                else { ctx.strokeStyle = '#000000'; ctx.moveTo(cx, 55); ctx.lineTo(cx - 11, 27); }
                ctx.stroke();

                ctx.strokeStyle = modoSim && fechado ? corSimAtiva : '#000000';
                ctx.fillStyle = '#ffffff';
                const hasteX = cx - 14 + (fechado ? 4 : 0);
                ctx.beginPath(); ctx.moveTo(cx - 6, 40); ctx.lineTo(hasteX, 40); ctx.moveTo(hasteX, 31); ctx.lineTo(hasteX, 49); ctx.stroke();

                if (c.tipo === 'BOT_EMERG') {
                    ctx.beginPath(); ctx.arc(hasteX, 40, 8, Math.PI * 0.5, Math.PI * 1.5);
                    ctx.fillStyle = modoSim ? '#ef4444' : '#ffffff'; ctx.fill(); ctx.stroke();
                } else if (c.tipo === 'RELE_TERMICO') {
                    ctx.beginPath(); ctx.moveTo(hasteX - 6, 33); ctx.lineTo(hasteX - 6, 38); ctx.lineTo(hasteX - 2, 38); ctx.lineTo(hasteX - 2, 43); ctx.lineTo(hasteX - 6, 43); ctx.lineTo(hasteX - 6, 47); ctx.stroke();
                } else if (c.tipo === 'FIM_CURSO') {
                    ctx.beginPath(); ctx.arc(hasteX - 4, 40, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                } else if (c.tipo.startsWith('SENS_') || ['DET_BARREIRA', 'TERMOSTATO', 'PRESSOSTATO', 'PRESSOSTATO_HIDR'].includes(c.tipo)) {
                    ctx.fillRect(hasteX - 10, 32, 10, 16); ctx.strokeRect(hasteX - 10, 32, 10, 16);
                } else if (c.tipo === 'CONT_TEMP_NA' || c.tipo === 'CONT_TEMP_NF') {
                    ctx.beginPath(); ctx.arc(hasteX - 4, 40, 5, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
                }

                if (c.tipo === 'BOT_DUPLO') {
                    const cx2 = 56;
                    ctx.strokeStyle = '#000000';
                    ctx.beginPath();
                    ctx.moveTo(cx2, 0); ctx.lineTo(cx2, 25);
                    ctx.moveTo(cx2, 55); ctx.lineTo(cx2, 80);
                    if (fechado) { ctx.strokeStyle = corSimAtiva; ctx.moveTo(cx2, 25); ctx.lineTo(cx2, 55); }
                    else { ctx.moveTo(cx2, 55); ctx.lineTo(cx2 - 11, 27); }
                    ctx.stroke();
                }
                return;
            }

            if (TIPOS_BOBINA.has(c.tipo)) {
                const cx = c.pinos[0].x;
                ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, 25); ctx.moveTo(cx, 55); ctx.lineTo(cx, c.h); ctx.stroke();
                ctx.fillStyle = (modoSim && c.energizado) ? '#fef08a' : '#ffffff';
                ctx.strokeStyle = (modoSim && c.energizado) ? corSimAtiva : '#000000';
                ctx.fillRect(cx - 12, 25, 24, 30); ctx.strokeRect(cx - 12, 25, 24, 30);

                if (c.tipo.startsWith('TEMP_') || c.tipo.startsWith('RELE_TEMPO_')) {
                    ctx.fillStyle = '#000000';
                    ctx.beginPath(); ctx.moveTo(cx - 12, 25); ctx.lineTo(cx + 12, 55); ctx.moveTo(cx + 12, 25); ctx.lineTo(cx - 12, 55); ctx.stroke();
                    ctx.font = 'bold 8px Arial';
                    ctx.fillText(c.tempoSeg + 's', cx - 7, 21);
                    if (modoSim) ctx.fillText(c.tempoAtual.toFixed(1) + 's', cx + 15, 43);
                } else {
                    ctx.fillStyle = '#000000'; ctx.font = 'bold 7.5px Arial';
                    ctx.fillText(c.cod, cx - 10, 43);
                }
                return;
            }

            if (c.tipo.startsWith('LAMP_') || c.tipo === 'LED_ELETR') {
                const cx = c.pinos[0].x;
                const acesa = modoSim && c.energizado;
                ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, 26); ctx.moveTo(cx, 54); ctx.lineTo(cx, c.h); ctx.stroke();

                if (acesa) {
                    ctx.save(); ctx.beginPath(); ctx.arc(cx, 40, 21, 0, Math.PI * 2);
                    ctx.fillStyle = c.corLed || '#22c55e'; ctx.globalAlpha = 0.35; ctx.fill(); ctx.restore();
                }

                ctx.beginPath(); ctx.arc(cx, 40, 14, 0, Math.PI * 2);
                ctx.fillStyle = acesa ? (c.corLed || '#22c55e') : '#ffffff';
                ctx.fill(); ctx.stroke();

                ctx.strokeStyle = acesa ? '#ffffff' : '#000000';
                ctx.beginPath(); ctx.moveTo(cx - 10, 30); ctx.lineTo(cx + 10, 50); ctx.moveTo(cx + 10, 30); ctx.lineTo(cx - 10, 50); ctx.stroke();
                return;
            }

            if (c.tipo === 'SIRENE') {
                const cx = 34;
                const tocando = modoSim && c.energizado;
                ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, 26); ctx.moveTo(cx, 54); ctx.lineTo(cx, 80); ctx.stroke();
                ctx.fillStyle = tocando ? '#fef08a' : '#ffffff';
                ctx.beginPath(); ctx.moveTo(cx - 10, 32); ctx.lineTo(cx + 4, 24); ctx.lineTo(cx + 4, 56); ctx.lineTo(cx - 10, 48); ctx.closePath(); ctx.fill(); ctx.stroke();
                if (tocando) {
                    ctx.strokeStyle = corSimAtiva;
                    ctx.beginPath(); ctx.arc(cx + 6, 40, 6, -0.7, 0.7); ctx.stroke();
                    ctx.beginPath(); ctx.arc(cx + 6, 40, 11, -0.7, 0.7); ctx.stroke();
                }
                return;
            }

            if (c.tipo === 'VOLTIMETRO' || c.tipo === 'AMPERIMETRO') {
                const cx = 44;
                const ehVolt = c.tipo === 'VOLTIMETRO';
                ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, 16); ctx.moveTo(cx, 68); ctx.lineTo(cx, 84); ctx.stroke();
                ctx.fillStyle = '#0f172a'; ctx.fillRect(cx - 32, 16, 64, 52); ctx.strokeStyle = '#000000'; ctx.strokeRect(cx - 32, 16, 64, 52);
                ctx.fillStyle = '#052e16'; ctx.fillRect(cx - 27, 22, 54, 28);
                const val = modoSim ? (c.energizado ? (ehVolt ? `${c.tensao}.0V` : `${c.corrente.toFixed(1)}A`) : (ehVolt ? '000.0V' : '00.0A')) : (ehVolt ? '--- V' : '--- A');
                ctx.fillStyle = (modoSim && c.energizado) ? '#4ade80' : '#86efac';
                ctx.font = 'bold 11px monospace'; ctx.fillText(val, cx - 23, 40);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 9px Arial'; ctx.fillText(ehVolt ? 'VOLTÍMETRO' : 'AMPERÍMETRO', cx - 28, 62);
                return;
            }

            // Blocos normalizados para todos os restantes componentes (pneumática, hidráulica, lógica, acessórios, etc.)
            const mx = c.w / 2, my = c.h / 2;
            const bw = Math.max(34, c.w - 22), bh = Math.max(26, c.h - 32);
            const bx = mx - bw / 2, by = my - bh / 2;

            c.pinos.forEach(p => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                if (p.y === 0) ctx.lineTo(p.x, by);
                else if (p.y === c.h) ctx.lineTo(p.x, by + bh);
                else if (p.x === 0) ctx.lineTo(bx, p.y);
                else if (p.x === c.w) ctx.lineTo(bx + bw, p.y);
                else ctx.lineTo(mx, my);
                ctx.stroke();
            });

            ctx.fillStyle = (modoSim && c.energizado) ? '#fef08a' : '#ffffff';
            ctx.strokeStyle = (modoSim && c.energizado) ? corSimAtiva : '#000000';
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeRect(bx, by, bw, bh);

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 8px Arial';
            const txt = c.cod || c.tag;
            ctx.fillText(txt, mx - Math.min(bw / 2 - 3, txt.length * 2.4), my + 3);
        }

        function desenharComponente(c) {
            ctx.save(); ctx.translate(c.x, c.y);
            desenharSimbolo(c);

            if (selecionadosIds.has(c.id)) {
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]);
                ctx.strokeRect(-4, -4, c.w + 8, c.h + 8); ctx.setLineDash([]);
            }

            if (mostrarTerminais) {
                c.pinos.forEach(p => {
                    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
                    if (p.nome) {
                        ctx.fillStyle = '#000000'; ctx.font = 'bold 8.5px Arial';
                        const ehMotor = c.tipo.startsWith('MOT_') || c.tipo === 'SERVOMOTOR';
                        if (ehMotor) ctx.fillText(p.nome, p.x - 6, p.y < 52 ? p.y - 5 : p.y + 11);
                        else ctx.fillText(p.nome, p.x + 5, p.y === 0 ? 11 : (p.y === c.h ? c.h - 4 : p.y + 3));
                    }
                });
            }
            ctx.restore();
        }

        function desenharFios(livePins, tMs) {
            if (rotasSujas) recalcularTodasRotasFios();
            const dashOffset = -(tMs / 35) % 24;

            fios.forEach((f, idx) => {
                const c1 = componentes.find(c => c.id === f.deComp);
                const c2 = componentes.find(c => c.id === f.paraComp);
                if (!c1 || !c2) return;

                const pts = obterPontosFio(idx);
                if (!pts.length) return;
                const ativo = modoSim && (livePins.has(`${f.deComp}:${f.dePino}`) || livePins.has(`${f.paraComp}:${f.paraPino}`));
                const selec = idx === fioSelecionadoIdx;

                ctx.strokeStyle = selec ? '#2563eb' : (ativo ? '#dc2626' : '#000000');
                ctx.lineWidth = selec ? 3.2 : (ativo ? 2.6 : 1.7);
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
                ctx.stroke();

                if (ativo && mostrarFluxo && !simPausada) {
                    ctx.save(); ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.2;
                    ctx.setLineDash([6, 10]); ctx.lineDashOffset = dashOffset;
                    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
                    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
                    ctx.stroke(); ctx.restore();
                }
            });

            if (ligandoDe) {
                const c1 = componentes.find(c => c.id === ligandoDe.compId);
                if (c1) {
                    const p1 = posPino(c1, ligandoDe.pinoIdx);
                    ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(pointerX, pointerY); ctx.stroke(); ctx.setLineDash([]);
                }
            }
        }

        function desenharNotas() {
            notas.forEach(n => {
                ctx.fillStyle = '#000000';
                ctx.font = n.tipo === 'TITULO' ? 'bold 14px Arial' : '11px Arial';
                ctx.fillText(n.texto, n.x, n.y);
            });
        }

        function desenharSelecaoCaixa() {
            if (!selecaoCaixa) return;
            const x = Math.min(selecaoCaixa.x1, selecaoCaixa.x2), y = Math.min(selecaoCaixa.y1, selecaoCaixa.y2);
            const w = Math.abs(selecaoCaixa.x2 - selecaoCaixa.x1), h = Math.abs(selecaoCaixa.y2 - selecaoCaixa.y1);
            ctx.save(); ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.2; ctx.setLineDash([5, 3]);
            ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); ctx.restore();
        }

        function loop(tMs) {
            const dt = Math.min(0.1, (tMs - ultimoFrame) / 1000);
            ultimoFrame = tMs;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            desenharGrelha();
            const livePins = resolverCircuito(dt);
            desenharFios(livePins, tMs);
            componentes.forEach(desenharComponente);
            desenharNotas();
            desenharSelecaoCaixa();
            requestAnimationFrame(loop);
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        function pinoProximo(x, y) {
            for (let i = componentes.length - 1; i >= 0; i--) {
                const c = componentes[i];
                for (let p = 0; p < c.pinos.length; p++) {
                    const pos = posPino(c, p);
                    if (Math.hypot(x - pos.x, y - pos.y) <= 13) return { compId: c.id, pinoIdx: p };
                }
            }
            return null;
        }

        function compNoPonto(x, y) {
            for (let i = componentes.length - 1; i >= 0; i--) {
                const c = componentes[i];
                if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) return c;
            }
            return null;
        }

        canvas.addEventListener('dblclick', (e) => {
            if (modoSim || ferramenta !== 'select') return;
            const { x, y } = getMousePos(e);
            if (pinoProximo(x, y) || compNoPonto(x, y)) return;
            selecaoCaixa = { x1: x, y1: y, x2: x, y2: y };
            selecionadosIds.clear(); selecionadoId = null; fioSelecionadoIdx = -1;
            renderPropriedades();
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (pinchDistInicial !== null) return;
            const { x, y } = getMousePos(e);
            pointerX = x; pointerY = y;

            if (selecaoCaixa) {
                selecaoCaixa.x2 = x; selecaoCaixa.y2 = y;
                const minX = Math.min(selecaoCaixa.x1, selecaoCaixa.x2), maxX = Math.max(selecaoCaixa.x1, selecaoCaixa.x2);
                const minY = Math.min(selecaoCaixa.y1, selecaoCaixa.y2), maxY = Math.max(selecaoCaixa.y1, selecaoCaixa.y2);
                selecionadosIds.clear();
                componentes.forEach(c => {
                    if (c.x + c.w >= minX && c.x <= maxX && c.y + c.h >= minY && c.y <= maxY) selecionadosIds.add(c.id);
                });
                selecionadoId = Array.from(selecionadosIds)[0] || null;
                selecaoCaixa = null;
                renderPropriedades();
                return;
            }

            if (arrastandoGrupo && arrastandoGrupo.fromInsert) { arrastandoGrupo = null; registrarHistorico(); return; }

            if (modoSim) {
                const c = compNoPonto(x, y);
                if (!c) return;
                if (TIPOS_PULSO.has(c.tipo)) c.ativo = true;
                else if (TIPOS_CHAVE.has(c.tipo)) c.ativo = !c.ativo;
                return;
            }

            if (ferramenta === 'delete') {
                const fioIdx = encontrarFioEmPonto(x, y);
                if (fioIdx >= 0) {
                    fios.splice(fioIdx, 1); invalidarRotasFios(); fioSelecionadoIdx = -1; renderPropriedades(); registrarHistorico(); return;
                }
                const c = compNoPonto(x, y);
                if (c) {
                    fios = fios.filter(f => f.deComp !== c.id && f.paraComp !== c.id);
                    componentes = componentes.filter(item => item.id !== c.id);
                    invalidarRotasFios();
                    selecionadosIds.delete(c.id);
                    if (selecionadoId === c.id) selecionadoId = null;
                    renderPropriedades(); registrarHistorico();
                }
                return;
            }

            const pino = pinoProximo(x, y);
            if (pino) {
                if (!ligandoDe) ligandoDe = pino;
                else {
                    if (ligandoDe.compId !== pino.compId || ligandoDe.pinoIdx !== pino.pinoIdx) {
                        fios.push({ deComp: ligandoDe.compId, dePino: ligandoDe.pinoIdx, paraComp: pino.compId, paraPino: pino.pinoIdx });
                        invalidarRotasFios();
                        registrarHistorico();
                    }
                    ligandoDe = null;
                }
                return;
            } else if (ligandoDe) { ligandoDe = null; return; }

            if (ferramenta === 'wire') return;

            const c = compNoPonto(x, y);
            if (c) {
                fioSelecionadoIdx = -1;
                if (e.shiftKey) {
                    if (selecionadosIds.has(c.id)) selecionadosIds.delete(c.id);
                    else selecionadosIds.add(c.id);
                    selecionadoId = c.id;
                } else {
                    if (!selecionadosIds.has(c.id)) { selecionadosIds = new Set([c.id]); selecionadoId = c.id; }
                    else selecionadoId = c.id;
                }
                renderPropriedades();

                const moviveis = componentes.filter(item => selecionadosIds.has(item.id) && !item.bloqueado);
                if (moviveis.length > 0) {
                    arrastandoGrupo = { startX: x, startY: y, itens: moviveis.map(item => ({ comp: item, origX: item.x, origY: item.y })) };
                }
            } else {
                const fioIdx = encontrarFioEmPonto(x, y);
                selecionadosIds.clear(); selecionadoId = null; fioSelecionadoIdx = fioIdx;
                renderPropriedades();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (pinchDistInicial !== null) return;
            const { x, y } = getMousePos(e);
            pointerX = x; pointerY = y;
            document.getElementById('stCursor').textContent = `${Math.round(x)}, ${Math.round(y)}`;

            if (selecaoCaixa) { selecaoCaixa.x2 = x; selecaoCaixa.y2 = y; return; }

            if (arrastandoGrupo) {
                const dx = x - arrastandoGrupo.startX, dy = y - arrastandoGrupo.startY;
                arrastandoGrupo.itens.forEach(it => {
                    const nx = it.origX + dx, ny = it.origY + dy;
                    it.comp.x = Math.max(0, Math.min(canvas.width - it.comp.w, snapGrelha ? Math.round(nx / GRID) * GRID : nx));
                    it.comp.y = Math.max(0, Math.min(canvas.height - it.comp.h, snapGrelha ? Math.round(ny / GRID) * GRID : ny));
                });
                invalidarRotasFios();
            }
        });

        function soltarInteracao() {
            if (arrastandoGrupo && !arrastandoGrupo.fromInsert) { arrastandoGrupo = null; registrarHistorico(); }
            if (modoSim) componentes.forEach(c => { if (TIPOS_PULSO.has(c.tipo)) c.ativo = false; });
        }

        canvas.addEventListener('pointerup', soltarInteracao);
        canvas.addEventListener('pointercancel', soltarInteracao);

        function verificarLigacoes() {
            const conectados = new Set();
            fios.forEach(f => { conectados.add(f.deComp); conectados.add(f.paraComp); });
            const isolados = componentes.filter(c => !conectados.has(c.id));
            if (isolados.length === 0) logMsg('Verificação OK: todas as peças estão ligadas.', 'OK');
            else logMsg(`Peças sem ligações: ${isolados.map(i => i.tag).join(', ')}.`, 'AVISO');
            setTabInferior('diag');
        }

        function executarAnalise(tipo) {
            if (tipo === 'TENSAO') {
                const fontes = componentes.filter(c => c.tipo.startsWith('FONTE_') || c.tipo.startsWith('TRANSF_') || c.tipo === 'BATERIA');
                logMsg(`Análise de Tensão: ${fontes.length} fonte(s) no circuito.`);
            } else if (tipo === 'CORRENTE') {
                const pTotal = componentes.reduce((acc, c) => acc + (c.energizado ? c.tensao * c.corrente : 0), 0);
                logMsg(`Potência ativa instantânea: ${(pTotal / 1000).toFixed(2)} kW.`);
            } else if (tipo === 'CONTINUIDADE') {
                logMsg(`Continuidade: ${fios.length} condutores e ${componentes.length} componentes.`);
            }
            setTabInferior('diag');
        }

        function setTabInferior(tab, btnEl) {
            tabInferior = tab;
            if (btnEl) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btnEl.classList.add('active');
            }
            renderPainelInferior();
        }

        function renderPainelInferior() {
            const body = document.getElementById('bottomBody');
            if (tabInferior === 'diag') body.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
            else if (tabInferior === 'med') {
                const ativos = componentes.filter(c => c.energizado || c.ativo);
                if (!ativos.length) {
                    body.innerHTML = `<div style="color:var(--text-muted)">Nenhum elemento ativo ou energizado no momento.</div>`;
                    return;
                }
                body.innerHTML = ativos.map(c => {
                    const rot = c.sentidoRotacao === 1 ? ' | Sentido: Horário (↻)' : (c.sentidoRotacao === -1 ? ' | Sentido: Anti-Horário (↺)' : '');
                    return `<div><strong>${c.tag}</strong> (${c.nome}) — Estado: ${c.energizado ? 'ENERGIZADO' : 'ATIVO'} | ${c.tensao}V / ${c.corrente}A${rot}</div>`;
                }).join('');
            } else if (tabInferior === 'hist') {
                body.innerHTML = simLog.length ? simLog.map(s => `<div>${s}</div>`).join('') : `<div style="color:var(--text-muted)">Sem eventos de simulação registados.</div>`;
            }
        }

        function atualizarBarraEstado() {
            document.getElementById('stCompCount').textContent = componentes.length;
            document.getElementById('stWireCount').textContent = fios.length;
        }

        function abrirModal(titulo, html) {
            document.getElementById('modalTitle').textContent = titulo;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modalBackdrop').classList.add('open');
        }

        function fecharModal() { document.getElementById('modalBackdrop').classList.remove('open'); }

        atualizarListaComponentesBarra();
        carregarModeloProjeto('DIRETO');
        renderPainelInferior();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
